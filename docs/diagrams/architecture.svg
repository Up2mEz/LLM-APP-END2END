<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="672" height="556" viewBox="0 0 672 556" role="img" aria-labelledby="ncd-arch-title ncd-arch-desc" id="architecture-root">
<title id="ncd-arch-title">NCD Evidence application architecture</title>
<desc id="ncd-arch-desc">The browser sends a Thai question to FastAPI and a bounded agent. The agent exchanges messages with Gemma through the class proxy, validates search_docs arguments, and calls hybrid retrieval. Retrieval reads the local corpus, index and table context, then returns evidence. Source-bound readers or Gemma review validate the answer and citations. The browser receives either a supported answer or an abstention. Gold is used only by the separate evaluation runner.</desc>
