[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncd-gemma"
version = "0.1.0"
description = "Thai NCD evidence assistant using frozen retrieval and Gemma class proxy"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.109,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2", "numpy>=2,<3",
  "sentence-transformers>=5.6,<7", "bm25s==0.3.12", "pythainlp==5.3.8",
  "jsonschema>=4.26,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
